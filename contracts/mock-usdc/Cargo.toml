[package]
name = "mock-usdc"
description = "Testnet-only USDC stand-in for Behest tier payments (D25): a NEP-141 token with a public, capped faucet mint"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
