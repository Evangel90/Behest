[package]
name = "behest"
description = "Behest: non-custodial inheritance protocol on NEAR"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Allows minute-scale timers. Only ever build with this for testnet demos.
demo-timers = []

[dependencies]
# `unstable` only exposes `env::ecrecover` (a stable host function) for D23.
near-sdk = { version = "5.30.1", features = ["unstable"] }

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing", "unstable"] }

