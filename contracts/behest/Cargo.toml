[package]
name = "behest"
description = "Behest: non-custodial inheritance protocol on NEAR"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Allows minute-scale timers. Only ever build with this for testnet demos.
demo-timers = []

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

